name = "small-plan"
main = "src/worker.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
[assets]
directory = "../static"
binding = "ASSETS"
run_worker_first = true
[[d1_databases]]
binding = "DB"
database_name = "small-plan"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[observability]
enabled = false
